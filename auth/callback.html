<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <title>STEMpolis Autentifikacija</title>
</head>

<body bgcolor="#FFFFFF" text="#000000" link="#0000FF" vlink="#800080" alink="#FF0000">

    <center>
        <div style="position: absolute; top: 16px; left: 16px;">
            <img src="../icon.svg" width="32" height="32" alt="STEMpolis ikona">
        </div>
        <center>
            <h1>STEMpolis</h1>
        </center>

        <h3 id="status-title">Provjera u tijeku...</h3>

        <br>

        <table border="1" cellpadding="10">
            <tr>
                <td align="center">
                    <a id="open-app-link" href="stempolis://login"><b>[ Otvori STEMpolis aplikaciju ]</b></a>
                    <br><br>
                    <a href="../">Početna stranica</a>
                </td>
            </tr>
        </table>
    </center>

    <script>
        (function () {
            var hash = window.location.hash || '';
            var searchParams = new URLSearchParams((window.location.search || '').replace(/^\?/, ''));
            var hashParams = new URLSearchParams(hash.replace(/^#/, ''));
            var params = new URLSearchParams(searchParams.toString());

            hashParams.forEach(function (value, key) {
                params.set(key, value);
            });

            var title = document.getElementById('status-title');
            var openLink = document.getElementById('open-app-link');
            var error = params.get('error_description') || params.get('error');

            if (error) {
                title.innerHTML = '<font color="red">Poveznica nije valjana ili je istekla.</font>';
                openLink.href = 'stempolis://login';
                return;
            }

            var intent = params.get('intent');
            var type = params.get('type');
            var target = intent === 'reset-password' || type === 'recovery' ? 'reset-password' : 'login';
            var intentValue = intent || (target === 'reset-password' ? 'reset-password' : 'confirm');
            var deepLink = 'stempolis://' + target + '?intent=' + encodeURIComponent(intentValue) + hash;

            if (target === 'reset-password') {
                title.textContent = 'Zahtjev za promjenu lozinke potvrđen.';
            } else {
                title.textContent = 'E-mail je potvrđen.';
            }

            openLink.href = deepLink;
            window.setTimeout(function () {
                window.location.href = deepLink;
            }, 300);
        })();
    </script>
</body>

</html>
