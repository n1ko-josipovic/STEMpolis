<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Preuzmite STEMpolis desktop aplikaciju.">
    <title>STEMpolis</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f7f8fb;
            --surface: rgba(255, 255, 255, 0.82);
            --surface-solid: #ffffff;
            --text: #172033;
            --muted: #667085;
            --border: rgba(23, 32, 51, 0.12);
            --accent: #0b63ce;
            --accent-hover: #004a9f;
            --green: #167c3b;
            --shadow: 0 24px 70px rgba(17, 24, 39, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 74% 22%, rgba(22, 124, 59, 0.1), transparent 34%),
                radial-gradient(circle at 18% 12%, rgba(11, 99, 206, 0.11), transparent 32%),
                linear-gradient(135deg, #f9fbff 0%, #f3f6f9 52%, #eef6f1 100%);
            overflow-x: hidden;
        }

        .shell {
            width: min(1040px, calc(100% - 48px));
            margin: 0 auto;
        }

        .topbar {
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand,
        .nav {
            display: inline-flex;
            align-items: center;
        }

        .brand {
            gap: 10px;
            font-weight: 700;
            text-decoration: none;
        }

        .brand img {
            width: 34px;
            height: 34px;
        }

        .nav {
            gap: 10px;
        }

        .link,
        .button {
            min-height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 0.92rem;
            text-decoration: none;
        }

        .link {
            color: var(--muted);
        }

        .button {
            border: 1px solid transparent;
            background: var(--accent);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 12px 28px rgba(11, 99, 206, 0.22);
        }

        .button:hover {
            background: var(--accent-hover);
        }

        .button.secondary {
            background: var(--surface-solid);
            border-color: var(--border);
            color: var(--text);
            box-shadow: none;
        }

        .hero {
            min-height: calc(100vh - 76px);
            display: grid;
            grid-template-columns: minmax(0, 0.92fr) minmax(360px, 1.08fr);
            align-items: center;
            gap: 62px;
            padding: 28px 0 72px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            color: var(--green);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .tag::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: currentColor;
        }

        h1 {
            margin: 0;
            font-size: clamp(3.2rem, 7vw, 5.8rem);
            line-height: 0.96;
            letter-spacing: 0;
        }

        .lead {
            max-width: 500px;
            margin: 22px 0 0;
            color: var(--muted);
            font-size: 1.06rem;
            line-height: 1.55;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 30px;
        }

        .version {
            margin-top: 14px;
            color: var(--muted);
            font-size: 0.86rem;
        }

        .preview {
            position: relative;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: var(--shadow);
            overflow: hidden;
            backdrop-filter: blur(18px);
        }

        .preview::before {
            content: "";
            position: absolute;
            inset: auto 12% -36px 12%;
            height: 80px;
            background: rgba(11, 99, 206, 0.11);
            filter: blur(42px);
        }

        .preview-titlebar {
            height: 38px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 14px;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.72);
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 999px;
            background: #c7ccd4;
        }

        .preview-title {
            margin-left: 8px;
            color: var(--muted);
            font-size: 0.78rem;
        }

        .preview-body {
            min-height: 360px;
            display: grid;
            grid-template-columns: 108px 1fr;
        }

        .preview-nav {
            padding: 16px 12px;
            border-right: 1px solid var(--border);
            background: rgba(248, 250, 252, 0.78);
        }

        .nav-pill {
            height: 28px;
            margin-bottom: 10px;
            border-radius: 6px;
            background: rgba(11, 99, 206, 0.08);
        }

        .nav-pill:nth-child(2) {
            background: rgba(22, 124, 59, 0.08);
        }

        .nav-pill:nth-child(3) {
            background: rgba(157, 93, 0, 0.1);
        }

        .preview-main {
            padding: 22px;
        }

        .headline-skeleton {
            width: 62%;
            height: 24px;
            border-radius: 5px;
            background: var(--text);
        }

        .card-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 28px 0 22px;
        }

        .mini-card {
            height: 68px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #ffffff;
        }

        .row {
            height: 42px;
            display: grid;
            grid-template-columns: 14px 1fr 58px;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #ffffff;
            padding: 0 12px;
        }

        .check,
        .line,
        .meta {
            border-radius: 999px;
        }

        .check {
            width: 12px;
            height: 12px;
            background: rgba(22, 124, 59, 0.22);
        }

        .line,
        .meta {
            height: 7px;
            background: #d8dee7;
        }

        .meta {
            background: rgba(11, 99, 206, 0.14);
        }

        @media (max-width: 860px) {
            .hero {
                grid-template-columns: 1fr;
                gap: 34px;
                padding-top: 26px;
            }

            .preview {
                max-width: 560px;
            }
        }

        @media (max-width: 620px) {
            .shell {
                width: min(100% - 28px, 1040px);
            }

            .topbar {
                height: auto;
                padding: 18px 0;
                align-items: flex-start;
                flex-direction: column;
                gap: 14px;
            }

            .nav,
            .actions {
                width: 100%;
            }

            .link,
            .button {
                flex: 1;
            }

            .preview-body {
                grid-template-columns: 80px 1fr;
                min-height: 300px;
            }

            .card-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header class="shell topbar">
        <a class="brand" href="./" aria-label="STEMpolis">
            <img src="./icon.svg" alt="">
            <span>STEMpolis</span>
        </a>
        <nav class="nav" aria-label="Akcije">
            <a class="link" href="stempolis://login">Otvori aplikaciju</a>
            <a class="button secondary" href="https://github.com/n1ko-josipovic/conf-Pg-STEMpolis/releases/latest">Preuzimanja</a>
        </nav>
    </header>

    <main class="shell hero">
        <section aria-labelledby="title">
            <div class="tag">Windows desktop</div>
            <h1 id="title">STEMpolis</h1>
            <p class="lead">Zadaci, bilješke i dokumenti u jednoj desktop aplikaciji.</p>
            <div class="actions">
                <a class="button" href="https://github.com/n1ko-josipovic/conf-Pg-STEMpolis/releases/latest">Preuzmi</a>
                <a class="button secondary" href="stempolis://login">Otvori aplikaciju</a>
            </div>
            <div class="version">1.2.0-alpha</div>
        </section>

        <section class="preview" aria-label="STEMpolis pregled">
            <div class="preview-titlebar">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="preview-title">STEMpolis</span>
            </div>
            <div class="preview-body">
                <div class="preview-nav">
                    <div class="nav-pill"></div>
                    <div class="nav-pill"></div>
                    <div class="nav-pill"></div>
                    <div class="nav-pill"></div>
                </div>
                <div class="preview-main">
                    <div class="headline-skeleton"></div>
                    <div class="card-row">
                        <div class="mini-card"></div>
                        <div class="mini-card"></div>
                        <div class="mini-card"></div>
                    </div>
                    <div class="row"><span class="check"></span><span class="line"></span><span class="meta"></span></div>
                    <div class="row"><span class="check"></span><span class="line"></span><span class="meta"></span></div>
                    <div class="row"><span class="check"></span><span class="line"></span><span class="meta"></span></div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
