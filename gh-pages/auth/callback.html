<!doctype html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="icon" href="../icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../styles.css">
    <title>STEMpolis</title>
</head>

<body>
    <main>
        <section class="hero">
            <h1 id="status-title">Provjera je u tijeku…</h1>
            <br>
            <br>
            <div class="actions">
                <a class="button button-primary" id="open-app-link" href="stempolis://login">Otvori aplikaciju</a>
                <a class="button button-secondary" href="../">Povratak na početnu stranicu</a>
            </div>
        </section>
    </main>

    <script>
        (function () {
            var hash = window.location.hash || '';
            var searchParams = new URLSearchParams((window.location.search || '').replace(/^\?/, ''));
            var hashParams = new URLSearchParams(hash.replace(/^#/, ''));
            var params = new URLSearchParams(searchParams.toString());

            hashParams.forEach(function (value, key) {
                params.set(key, value);
            });

            var title = document.getElementById('status-title');
            var openLink = document.getElementById('open-app-link');
            var error = params.get('error_description') || params.get('error');

            if (error) {
                title.textContent = 'Poveznica nije valjana ili je istekla.';
                openLink.href = 'stempolis://login';
                return;
            }

            var intent = params.get('intent');
            var type = params.get('type');
            var target = intent === 'reset-password' || type === 'recovery' ? 'reset-password' : 'login';
            var intentValue = intent || (target === 'reset-password' ? 'reset-password' : 'confirm');
            var deepLink = 'stempolis://' + target + '?intent=' + encodeURIComponent(intentValue) + hash;

            title.textContent = target !== 'reset-password'
                ? `Otvorite aplikaciju.`
                : 'E-mail adresa je potvrđena.';

            openLink.href = deepLink;
            window.setTimeout(function () {
                window.location.href = deepLink;
            }, 300);
        }());
    </script>
</body>

</html>
